<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auplodes | Secure Cloud</title>
    <script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; text-align: center; }
        
        .tg-box { margin: 20px auto; width: 90%; max-width: 400px; padding: 12px; background: #000; border-radius: 10px; border: 2px solid; animation: rgb 3s infinite; }
        @keyframes rgb { 0% { border-color: red; } 33% { border-color: lime; } 66% { border-color: blue; } 100% { border-color: red; } }
        
        .main { max-width: 500px; margin: 50px auto; background: var(--card); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: var(--accent); font-size: 2.5rem; }

        /* Loading Bar CSS */
        #loader-container { display: none; margin: 20px 0; }
        .progress-bg { background: #334155; border-radius: 20px; height: 15px; width: 100%; position: relative; overflow: hidden; }
        .progress-fill { background: var(--accent); height: 100%; width: 0%; transition: 0.3s; box-shadow: 0 0 10px var(--accent); }
        
        .btn { background: var(--accent); color: #000; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        input { width: 80%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="tg-box"><a href="https://t.me/+PvAMD5GrdcBkNDE1" style="color:white; text-decoration:none;">JOIN TELEGRAM</a></div>

    <div class="main">
        <h1>Auplodes</h1>
        <p>Enterprise-grade file hosting by ANKIT X MODZ</p>

        <input type="hidden" role="uploadcare-uploader" data-public-key="d2dac43b0699b5b058d8" id="uploader" />

        <div id="loader-container">
            <p id="percentText">Uploading: 0%</p>
            <div class="progress-bg"><div class="progress-fill" id="fill"></div></div>
        </div>

        <div id="result" style="margin-top:20px;" class="hidden"></div>
    </div>

    <script>
        const widget = uploadcare.Widget('#uploader');
        const loader = document.getElementById('loader-container');
        const fill = document.getElementById('fill');
        const pText = document.getElementById('percentText');

        widget.onUploadStart((file) => {
            loader.style.display = 'block';
            file.progress((info) => {
                let p = Math.round(info.progress * 100);
                fill.style.width = p + '%';
                pText.innerText = "Processing: " + p + "%";
            });
        });

        widget.onUploadComplete((info) => {
            loader.style.display = 'none';
            // Yahan hum apna website ka link banayenge
            // Agar aapki site ankit.github.io/auplodes hai, toh niche waisa hi likhein
            const currentUrl = window.location.href.replace('index.html', '');
            const shareLink = `${currentUrl}download.html?fileId=${info.uuid}&name=${encodeURIComponent(info.name)}`;

            document.getElementById('result').innerHTML = `
                <p style="color:#22c55e">File Ready to Share!</p>
                <input type="text" value="${shareLink}" id="finalLink" readonly>
                <button class="btn" onclick="copy()">Copy Share Link</button>
            `;
        });

        function copy() {
            const copyText = document.getElementById("finalLink");
            copyText.select();
            document.execCommand("copy");
            alert("Link copied!MAJE KRO");
        }
    </script>
</body>
</html>
